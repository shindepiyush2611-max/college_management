{% extends 'hospital/base.html' %}

{% block title %}Patient Form{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    {% if form.instance.pk %}
                        Edit Patient
                    {% else %}
                        Add New Patient
                    {% endif %}
                </h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-3">

                        <button type="submit" class="btn btn-success">
                            Save Patient
                        </button>

                        <a href="{% url 'patient_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
